<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 深色圆角背景 -->
  <rect width="32" height="32" rx="7" fill="#1a1a1a"/>

  <!-- 蜡烛1：做空（A股绿跌） -->
  <line x1="7" y1="14" x2="7" y2="17" stroke="#00c07a" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="4" y="17" width="6" height="7" rx="1" fill="#00c07a"/>
  <line x1="7" y1="24" x2="7" y2="27" stroke="#00c07a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 蜡烛2：做多（A股红涨） -->
  <line x1="16" y1="8" x2="16" y2="11" stroke="#ff4d4f" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="13" y="11" width="6" height="10" rx="1" fill="#ff4d4f"/>
  <line x1="16" y1="21" x2="16" y2="25" stroke="#ff4d4f" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 蜡烛3：金色大阳线（主角） -->
  <line x1="25" y1="4" x2="25" y2="7" stroke="#f0c040" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="22" y="7" width="6" height="14" rx="1" fill="#f0c040"/>
  <line x1="25" y1="21" x2="25" y2="25" stroke="#f0c040" stroke-width="1.5" stroke-linecap="round"/>
</svg>
