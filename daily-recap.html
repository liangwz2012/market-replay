  .ann{ font-size:13px; color:#cdd5de; margin-top:10px; }

  .relive h3{ font-size:17px; margin:6px 0 8px; }

  .qr{ width:104px; height:104px; background:#fff; border-radius:8px; display:grid; place-items:center; color:#0b0e14; font-size:11px; text-align:center; }

/* series → SVG polyline points；flat 线居中，避免贴底 */
function spark(s, w, h, pad){
  pad = pad || 6;
  if (!s || s.length < 2) return '';
  var mn = Math.min.apply(null, s), mx = Math.max.apply(null, s), rng = mx - mn, n = s.length;
  return s.map(function (v, i){
    var x = (i / (n - 1)) * w;
    var y = rng ? pad + (1 - (v - mn) / rng) * (h - 2 * pad) : h / 2;
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
}

    '<text x="164" y="18" fill="#5a626d" font-size="10">14:00</text>';
  if (q.pm_stock && q.pm_stock.length) svg += '<polyline fill="none" stroke="#37a0dd" stroke-width="2.4" points="' + spark(q.pm_stock, 320, 120, 12) + '"/>';
  if (q.pm_bond && q.pm_bond.length) svg += '<polyline fill="none" stroke="#f0c040" stroke-width="2.4" points="' + spark(q.pm_bond, 320, 120, 12) + '"/>';
  document.getElementById('q-pmsvg').innerHTML = svg;
  document.getElementById('q-ann').innerHTML = q.annotation || '';

  var rv = document.getElementById('rv');
  rv.classList.add('show');
  rv.scrollIntoView({ behavior:'smooth', block:'center' });
}

/* ===== 分享：现画一张转发海报（canvas→图片），弹窗长按保存/转发，微信里也能用 ===== */
function _strip(s){ return (s || '').replace(/<[^>]+>/g, ''); }
function _rr(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function _wrap(c, t, maxW){ var lines=[], cur=''; for (var i=0;i<t.length;i++){ var ch=t.charAt(i); if (ch==='\n'){ lines.push(cur); cur=''; continue; } var test=cur+ch; if (c.measureText(test).width>maxW && cur){ lines.push(cur); cur=ch; } else cur=test; } if (cur||lines.length===0) lines.push(cur); return lines; }
function _loadImg(src){ return new Promise(function(res){ var im=new Image(); im.onload=function(){ res(im); }; im.onerror=function(){ res(null); }; im.src=src; }); }
function _spark(c, s, x, y, w, h, color){ if (!s || s.length<2) return; var mn=Math.min.apply(null,s), mx=Math.max.apply(null,s), rng=mx-mn; c.strokeStyle=color; c.lineWidth=2.2; c.lineJoin='round'; c.beginPath(); for (var i=0;i<s.length;i++){ var px=x+(i/(s.length-1))*w, py=rng? y+(1-(s[i]-mn)/rng)*h : y+h/2; if (i) c.lineTo(px,py); else c.moveTo(px,py); } c.stroke(); }

function makePoster(cb){
  _loadImg('assets/mp-qr.png?v=20260628a').then(function(qrImg){
    var FONT='"PingFang SC","Microsoft YaHei",sans-serif', W=680, pad=46, DPR=3;
    var cm=D.commentary||{};
    var tone=_strip(cm.tone_html||D.tone_html||'').replace('今日主线：','');
    var plain=_strip(cm.plain||'');   // 说人话（通俗版）——海报主打
    var assets=D.assets||[];
    // 核心要点：优先 poster_points；否则正文首句兜底。务必 _strip 去掉 <b> 标签（否则标签字面画到图上）
    var rawPts=(cm.poster_points&&cm.poster_points.length)?cm.poster_points.slice(0,4)
      :(cm.paragraphs||D.narrative||[]).slice(0,4).map(function(p){
          var t=_strip(p).replace(/^[「"]+/,''); var dot=t.search(/[。；]/); if (dot>12) t=t.slice(0,dot); return t; });
    // 拆 {label, body}：「：」前为金色小标，其后为正文
    var pts=rawPts.map(function(p){ p=_strip(p); var i=p.search(/[:：]/);
      return (i>0)?{label:p.slice(0,i), body:p.slice(i+1).replace(/^\s+/,'')}:{label:'', body:p}; });
    var onTags=(cm.poster_tags&&cm.poster_tags.length)?cm.poster_tags.slice(0,5)
      :(D.logic_tags||[]).filter(function(t){return t.on;}).map(function(t){return t.t;});

    // —— 预测量高度 ——
    var mc=document.createElement('canvas').getContext('2d');
    mc.font='600 29px '+FONT; var toneLines=_wrap(mc, tone, W-2*pad-36);
    mc.font='23px '+FONT; var plainLines=plain?_wrap(mc, plain, W-2*pad-36):[];
    var ptW=W-2*pad-40;
    var ptBlocks=pts.map(function(p){ mc.font='23px '+FONT; return {label:p.label, lines:_wrap(mc, p.body, ptW)}; });

    var headH=164, labelH=46, cellH=98;
    var toneH=18+toneLines.length*42+18;
    var plainH=plain?(58+plainLines.length*34+14):0;   // 含 badge + 行 + 间距
    var assetsH=Math.ceil(assets.length/2)*(cellH+12);
    var chipsH=onTags.length?44:0;
    var pointsH=ptBlocks.reduce(function(s,b){return s+(b.label?36:0)+b.lines.length*34+20;},0);
    var logicH=labelH+chipsH+pointsH+4;
    var qw=184, qh=qrImg?Math.round(qw*qrImg.height/qrImg.width):206;
    var H=headH+toneH+plainH+labelH+assetsH+labelH+chipsH+pointsH+4+28+qh+56;

    var cv=document.createElement('canvas'); cv.width=W*DPR; cv.height=H*DPR; var c=cv.getContext('2d'); c.scale(DPR,DPR);
    c.textBaseline='alphabetic';
    var g=c.createLinearGradient(0,0,0,H); g.addColorStop(0,'#1c1408'); g.addColorStop(.14,'#0b0e14'); g.addColorStop(1,'#0b0e14'); c.fillStyle=g; c.fillRect(0,0,W,H);
    // 头部
    c.textAlign='center';
    c.fillStyle='#f0c040'; c.font='600 22px '+FONT; c.fillText('人 人 复 盘 · 每 日 复 盘', W/2, 52);
    c.fillStyle='#f6d98a'; c.font='700 44px '+FONT; c.fillText('每日复盘', W/2, 108);
    c.fillStyle='#8b949e'; c.font='21px '+FONT; c.fillText(D.date_label||'', W/2, 144);
    var y=headH;
    // 主线
    c.fillStyle='rgba(240,192,64,.09)'; _rr(c,pad,y,W-2*pad,toneH-8,14); c.fill();
    c.fillStyle='#f0c040'; c.fillRect(pad,y,4,toneH-8);
    c.textAlign='left'; c.fillStyle='#f0c040'; c.font='600 29px '+FONT;
    toneLines.forEach(function(l,i){ c.fillText(l, pad+26, y+46+i*42); });
    y+=toneH;
    // 说人话（通俗版，青色框）——海报主打的"看得懂"层
    if (plain){
      var bh=plainH-14;
      c.fillStyle='rgba(38,166,154,.10)'; _rr(c,pad,y,W-2*pad,bh,14); c.fill();
      c.strokeStyle='rgba(95,208,196,.42)'; c.lineWidth=1.2; _rr(c,pad,y,W-2*pad,bh,14); c.stroke();
      c.textAlign='left'; c.fillStyle='#5fd0c4'; c.font='700 19px '+FONT; c.fillText('💡 说人话', pad+20, y+34);
      c.fillStyle='#e6edf3'; c.font='23px '+FONT;
      plainLines.forEach(function(l,i){ c.fillText(l, pad+20, y+68+i*34); });
      y+=plainH;
    }
    // 多资产速览
    c.textAlign='left'; c.fillStyle='#8b949e'; c.font='600 20px '+FONT; c.fillText('多资产速览', pad, y+26); y+=labelH;
    var colW=(W-2*pad-16)/2;
    for (var i=0;i<assets.length;i++){ var a=assets[i], cx=pad+(i%2)*(colW+16), cy=y+Math.floor(i/2)*(cellH+12);
      c.fillStyle='#121620'; _rr(c,cx,cy,colW,cellH,12); c.fill();
      c.textAlign='left'; c.fillStyle='#8b949e'; c.font='18px '+FONT; c.fillText(a.name, cx+16, cy+28);
      var col=a.chg_dir==='up'?'#ef5350':a.chg_dir==='down'?'#26a69a':'#f0c040';
      c.fillStyle=col; c.font='700 31px '+FONT; c.fillText(a.chg, cx+16, cy+70);
      _spark(c, a.series, cx+colW-110, cy+36, 94, 42, col);
    }
    y+=assetsH;
    // 核心观点
    c.textAlign='left'; c.fillStyle='#8b949e'; c.font='600 20px '+FONT; c.fillText('盘面逻辑 · 核心观点', pad, y+26); y+=labelH;
    if (onTags.length){ var chx=pad; c.font='600 18px '+FONT;
      onTags.forEach(function(t){ var tw=c.measureText(t).width+28;
        c.fillStyle='rgba(240,192,64,.14)'; _rr(c,chx,y,tw,30,15); c.fill();
        c.fillStyle='#f0c040'; c.textAlign='left'; c.fillText(t, chx+14, y+21); chx+=tw+10; });
      y+=chipsH;
    }
    ptBlocks.forEach(function(b,idx){
      c.textAlign='left';
      c.fillStyle='#f0c040'; c.font='700 23px '+FONT; c.fillText((idx+1)+'', pad, y+23);
      var yy=y;
      if (b.label){ c.fillStyle='#f0c040'; c.font='700 24px '+FONT; c.fillText(b.label, pad+34, yy+23); yy+=36; }
      c.fillStyle='#d6dde6'; c.font='23px '+FONT;
      b.lines.forEach(function(l,i){ c.fillText(l, pad+34, yy+23+i*34); });
      y+=(b.label?36:0)+b.lines.length*34+20;
    });
    y+=14;
    // 二维码 + 引导
    if (qrImg){ c.drawImage(qrImg, pad, y, qw, qh);
      c.textAlign='left'; c.fillStyle='#e6edf3'; c.font='600 27px '+FONT; c.fillText('微信扫码 · 看完整复盘', pad+qw+22, y+52);
      c.fillStyle='#8b949e'; c.font='20px '+FONT;
      ['分品种详评 · 历史对照 · 互动推演','每天收盘后更新'].forEach(function(l,i){ c.fillText(l, pad+qw+22, y+90+i*32); });
    }
    c.textAlign='center'; c.fillStyle='#5a626d'; c.font='16px '+FONT; c.fillText('投资者教育 · 客观梳理 · 不构成投资建议', W/2, H-24);
    cb(cv.toDataURL('image/png'));
  });
}
function doShare(){
  try{ makePoster(function(dataUrl){ if (dataUrl){ document.getElementById('poster-img').src=dataUrl; document.getElementById('poster-modal').classList.add('show'); } }); }
  catch(e){ var u=location.href.split('?')[0]; try{ navigator.clipboard.writeText(u); }catch(_){} alert('链接已复制 ✓'); }
}
function closePoster(){ document.getElementById('poster-modal').classList.remove('show'); }

/* ===== 日期列表导航：进入先看日期列表，点某天才进当天复盘 ===== */
function showList(){ document.getElementById('list-view').style.display=''; document.getElementById('detail-view').style.display='none'; window.scrollTo(0,0); }
function showDetail(){ document.getElementById('list-view').style.display='none'; document.getElementById('detail-view').style.display=''; window.scrollTo(0,0); }
var TYPE_LABEL = { day:'日报', week:'周报', month:'月报' };
function renderList(list){
  list = list || [];
  if (!list.length){ document.getElementById('dl-rows').innerHTML = '<div class="dl-empty">暂无复盘，收盘后更新</div>'; return; }
  // 节奏说明（不放空占位卡——周报/月报有真实内容时才进 list 显示）
  var html = '<div class="tl-cad">📈 复盘随交易日累积：<b style="color:#d6dde6">每日一篇</b>，每周五汇成「周报」、月末汇成「月报」。</div>';
  html += list.map(function(it){
    var ty = it.type || 'day';
    return '<div class="tl-row" onclick="openDate(\'' + it.date + '\')">' +
      '<span class="tl-badge ' + ty + '">' + (TYPE_LABEL[ty] || '日报') + '</span>' +
      '<div class="tl-date">' + (it.date_label || it.date) + '</div>' +
      '<div class="tl-tone">' + (it.tone || '') + '</div>' +
      '<div class="tl-go">看复盘 →</div></div>';
  }).join('');
  document.getElementById('dl-rows').innerHTML = html;
}
function loadDate(date){
  showDetail();
  fetch('recap-archive/' + date + '.json?v=' + Date.now())
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(render)
    .catch(function(){ fetch('recap-data.json?v=' + Date.now()).then(function(r){ return r.json(); }).then(render).catch(function(){ render(FALLBACK); }); });
}
function openDate(date){ try{ history.pushState({date:date}, '', '?date=' + date); }catch(e){} loadDate(date); }
function backToList(){ try{ history.pushState({}, '', location.pathname); }catch(e){} showList(); }
// 小程序内：返回大厅=navigateBack；进推荐剧本=navigateTo play 页(开盘/研究)。浏览器内：走网页版链接。
function inMini(){ try { return window.__wxjs_environment === 'miniprogram' || /miniProgram/i.test(navigator.userAgent); } catch(e){ return false; } }
function goLobby(){ if (inMini() && window.wx && wx.miniProgram) { wx.miniProgram.navigateBack({ delta: 1 }); } else { location.href = '/'; } }
function goCase(cs){ if (inMini() && window.wx && wx.miniProgram) { wx.miniProgram.navigateTo({ url: '/pages/play/play' + (cs ? ('?id=' + cs) : '') }); } else { location.href = cs ? ('/?case=' + cs) : '/'; } }
function _qdate(){ var m = location.search.match(/[?&]date=([0-9-]+)/); return m ? m[1] : ''; }
window.addEventListener('popstate', function(){ var d=_qdate(); if(d) loadDate(d); else showList(); });

(function boot(){
  var d = _qdate();
  fetch('recap-list.json?v=' + Date.now())
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(list){ renderList(list); if(d) loadDate(d); else showList(); })
    .catch(function(){ /* 离线/file:// 无清单 → 直接显示内嵌当天详情 */
      showDetail(); render(FALLBACK);
      fetch('recap-data.json?v=' + Date.now()).then(function(r){ return r.json(); }).then(render).catch(function(){});
    });
})();
</script>
